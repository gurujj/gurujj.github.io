<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오프셋 테이블</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid #ccc; padding: .45rem .7rem; text-align: right; }
  th { background: #f2f4f7; }
  td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align: left; }
  tr.pad td { color: #999; background: #fafafa; font-style: italic; }
  tfoot td { font-weight: 600; background: #f2f4f7; }
  textarea { width: 100%; height: 9rem; font-family: ui-monospace, monospace; }
  button { padding: .4rem 1rem; }
  code { background: #f2f4f7; padding: 0 .3rem; }
</style>
</head>
<body>
<h1>오프셋 테이블</h1>
<p>한 줄에 <code>이름 타입</code> 형식으로 필드를 입력하면 C 구조체 규칙(자연 정렬)에 따라 오프셋을 계산합니다.<br>
지원 타입: <code>char int8 uint8 short int16 uint16 int int32 uint32 float long int64 uint64 double ptr</code> (배열: <code>buf char[16]</code>)</p>

<textarea id="src">magic uint32
version uint8
flags uint16
length uint64
name char[10]
ratio float</textarea>
<p><button id="run">계산</button></p>

<table id="out">
  <thead><tr><th>필드</th><th>타입</th><th>오프셋 (10진)</th><th>오프셋 (16진)</th><th>크기</th><th>정렬</th></tr></thead>
  <tbody></tbody>
  <tfoot></tfoot>
</table>

<script>
const TYPES = {
  char:[1,1], int8:[1,1], uint8:[1,1],
  short:[2,2], int16:[2,2], uint16:[2,2],
  int:[4,4], int32:[4,4], uint32:[4,4], float:[4,4],
  long:[8,8], int64:[8,8], uint64:[8,8], double:[8,8], ptr:[8,8]
};
const hex = n => "0x" + n.toString(16).toUpperCase().padStart(4, "0");
const alignUp = (n, a) => Math.ceil(n / a) * a;

function compute(text) {
  const rows = []; let off = 0, maxAlign = 1;
  for (const line of text.split("\n")) {
    const t = line.trim(); if (!t) continue;
    const m = t.match(/^(\S+)\s+(\w+)(?:\[(\d+)\])?$/);
    if (!m || !TYPES[m[2]]) throw new Error("해석 불가: " + t);
    const [size, align] = TYPES[m[2]], count = m[3] ? +m[3] : 1;
    const start = alignUp(off, align);
    if (start > off) rows.push({ pad: true, off, size: start - off });
    rows.push({ name: m[1], type: m[2] + (m[3] ? `[${count}]` : ""), off: start, size: size * count, align });
    off = start + size * count; maxAlign = Math.max(maxAlign, align);
  }
  const total = alignUp(off, maxAlign);
  if (total > off) rows.push({ pad: true, off, size: total - off });
  return { rows, total, maxAlign };
}

function render() {
  const body = document.querySelector("#out tbody"), foot = document.querySelector("#out tfoot");
  body.innerHTML = foot.innerHTML = "";
  try {
    const { rows, total, maxAlign } = compute(document.getElementById("src").value);
    for (const r of rows) {
      const tr = document.createElement("tr");
      if (r.pad) tr.className = "pad";
      const cells = r.pad ? ["(패딩)", "", r.off, hex(r.off), r.size, ""] : [r.name, r.type, r.off, hex(r.off), r.size, r.align];
      cells.forEach(c => { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); });
      body.appendChild(tr);
    }
    foot.innerHTML = `<tr><td colspan="4">전체 크기</td><td>${total}</td><td>${maxAlign}</td></tr>`;
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" style="color:#c00;text-align:left">${e.message}</td></tr>`;
  }
}
document.getElementById("run").onclick = render;
render();
</script>
</body>
</html>
